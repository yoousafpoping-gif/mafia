<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87840"/>
      <stop offset=".55" stop-color="#8a5f2e"/>
      <stop offset="1" stop-color="#5c3d18"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9aa8"/>
      <stop offset="1" stop-color="#4a525e"/>
    </linearGradient>
  </defs>
  <!-- صندوق خشبي: كيسة صناديق السوق السودا بأحزمة حديد -->
  <rect x="28" y="86" width="200" height="140" rx="12" fill="url(#wood)" stroke="#3d280e" stroke-width="5"/>
  <!-- ألواح خشب -->
  <g stroke="#5c3d18" stroke-width="3">
    <path d="M30 130 H226"/><path d="M30 176 H226"/>
  </g>
  <!-- غطا مائل -->
  <path d="M28 86 L58 52 L238 52 L228 86 Z" fill="url(#wood)" stroke="#3d280e" stroke-width="5" stroke-linejoin="round"/>
  <!-- أحزمة الحديد -->
  <rect x="52" y="86" width="24" height="140" fill="url(#iron)" opacity=".9"/>
  <rect x="180" y="86" width="24" height="140" fill="url(#iron)" opacity=".9"/>
  <rect x="28" y="140" width="200" height="20" fill="url(#iron)" opacity=".8"/>
  <!-- مسامير -->
  <g fill="#2e333b">
    <circle cx="64" cy="150" r="4"/><circle cx="192" cy="150" r="4"/>
  </g>
  <!-- قفل -->
  <rect x="112" y="122" width="32" height="28" rx="5" fill="#c9a227" stroke="#5c440e" stroke-width="3"/>
  <circle cx="128" cy="136" r="5" fill="#5c440e"/>
  <!-- شق ضوء -->
  <path d="M64 88 Q128 80 192 88" fill="none" stroke="#ffe98f" stroke-width="3" opacity=".45"/>
</svg>
