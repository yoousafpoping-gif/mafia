<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="felt" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#1b5e3f"/>
      <stop offset=".6" stop-color="#0f4029"/>
      <stop offset="1" stop-color="#072015"/>
    </radialGradient>
    <linearGradient id="goldArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6b14"/>
      <stop offset=".5" stop-color="#f4d97b"/>
      <stop offset="1" stop-color="#8f6b14"/>
    </linearGradient>
  </defs>
  <!-- الكازينو: جوخ أخضر وأقواس آرت-ديكو ذهبية -->
  <rect width="1920" height="1080" fill="url(#felt)"/>
  <!-- أقواس آرت ديكو متداخلة -->
  <g fill="none" stroke="url(#goldArc)">
    <path d="M960 1250 A860 860 0 0 1 282 620" stroke-width="10" opacity=".5"/>
    <path d="M960 1330 A940 940 0 0 1 200 640" stroke-width="5" opacity=".35"/>
    <path d="M960 1250 A860 860 0 0 0 1638 620" stroke-width="10" opacity=".5"/>
    <path d="M960 1330 A940 940 0 0 0 1720 640" stroke-width="5" opacity=".35"/>
    <path d="M960 1120 A730 730 0 0 1 394 580" stroke-width="3" opacity=".25"/>
    <path d="M960 1120 A730 730 0 0 0 1526 580" stroke-width="3" opacity=".25"/>
  </g>
  <!-- مروحة شعاعات ذهبية من فوق -->
  <g stroke="url(#goldArc)" stroke-width="4" opacity=".22">
    <path d="M960 -80 L700 420"/><path d="M960 -80 L820 400"/><path d="M960 -80 L960 396"/><path d="M960 -80 L1100 400"/><path d="M960 -80 L1220 420"/>
  </g>
  <!-- رموز أوراق خفيفة في الزوايا -->
  <g opacity=".16" fill="#f4d97b">
    <path d="M180 180 c-30 30 -30 60 0 78 c30 -18 30 -48 0 -78 z" transform="rotate(-20 180 219)"/>
    <path d="M1740 180 c-30 30 -30 60 0 78 c30 -18 30 -48 0 -78 z" transform="rotate(20 1740 219)"/>
    <path d="M180 840 c-30 30 -30 60 0 78 c30 -18 30 -48 0 -78 z" transform="rotate(20 180 879)"/>
    <path d="M1740 840 c-30 30 -30 60 0 78 c30 -18 30 -48 0 -78 z" transform="rotate(-20 1740 879)"/>
  </g>
  <!-- معين مركزي خافت زي ترابيزة البوكر -->
  <g fill="none" stroke="#f4d97b" opacity=".18">
    <path d="M960 300 L1240 540 960 780 680 540 Z" stroke-width="6"/>
    <path d="M960 360 L1180 540 960 720 740 540 Z" stroke-width="3"/>
