<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a31220"/>
      <stop offset=".5" stop-color="#e63946"/>
      <stop offset="1" stop-color="#6d0a14"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#7a0e1a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- إطار الدم: لاك قرمزي وقطرات بتقطّر من الضلع العلوي -->
  <rect x="16" y="16" width="480" height="736" rx="54" fill="none" stroke="url(#blood)" stroke-width="30" filter="url(#glow)"/>
  <rect x="42" y="42" width="428" height="684" rx="36" fill="none" stroke="#2b0307" stroke-width="3" opacity=".8"/>
  <!-- قطرات متناثرة على الحد العلوي -->
  <g fill="url(#drip)">
    <path d="M96 30 q6 22 0 34 q-6 -12 0 -34"/>
    <path d="M212 26 q5 14 0 24 q-5 -10 0 -24"/>
    <path d="M318 30 q7 30 0 46 q-7 -16 0 -46"/>
    <path d="M430 28 q4 10 0 18 q-4 -8 0 -18"/>
  </g>
  <!-- معينات الزوايا -->
  <g filter="url(#glow)">
    <path d="M44 44 l16 10 -16 10 -16 -10 z" fill="#ff6b74"/>
    <path d="M468 44 l16 10 -16 10 -16 -10 z" fill="#ff6b74"/>
    <path d="M44 724 l16 10 -16 10 -16 -10 z" fill="#ff6b74"/>
    <path d="M468 724 l16 10 -16 10 -16 -10 z" fill="#ff6b74"/>
  </g>
</svg>
