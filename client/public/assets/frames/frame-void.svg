<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <radialGradient id="nebula" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6d5bd0" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#372a78" stop-opacity=".55"/>
      <stop offset="1" stop-color="#120c26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voidEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338a8"/>
      <stop offset=".5" stop-color="#211a4e"/>
      <stop offset="1" stop-color="#0d0a20"/>
    </linearGradient>
    <linearGradient id="voidAcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset=".5" stop-color="#b3a4ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <filter id="voidGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- إطار العدم: كون بنفسجي غامق — سديم ونجوم -->
  <rect x="16" y="16" width="480" height="736" rx="54" fill="none" stroke="url(#voidEdge)" stroke-width="32"/>
  <rect x="16" y="16" width="480" height="736" rx="54" fill="none" stroke="url(#voidAcc)" stroke-width="4" filter="url(#voidGlow)" opacity=".9"/>
  <rect x="44" y="44" width="424" height="680" rx="34" fill="none" stroke="#8b7bff" stroke-width="2" opacity=".45"/>
  <!-- سديم داخل الحدود -->
  <ellipse cx="70" cy="200" rx="26" ry="60" fill="url(#nebula)"/>
  <ellipse cx="442" cy="520" rx="26" ry="70" fill="url(#nebula)"/>
  <!-- نجوم نقطية متناثرة على الحدود -->
  <g fill="#e6e0ff" filter="url(#voidGlow)">
    <circle cx="31" cy="120" r="3"/>
    <circle cx="100" cy="31" r="2.5"/>
    <circle cx="256" cy="30" r="3.5"/>
    <circle cx="400" cy="31" r="2.5"/>
    <circle cx="481" cy="140" r="3"/>
    <circle cx="481" cy="380" r="2.5"/>
    <circle cx="31" cy="430" r="2.5"/>
    <circle cx="31" cy="660" r="3"/>
    <circle cx="140" cy="737" r="2.5"/>
    <circle cx="370" cy="737" r="3"/>
    <circle cx="481" cy="650" r="2.5"/>
  </g>
  <!-- نجمة رباعية فوق -->
  <g transform="translate(256 52)" filter="url(#voidGlow)">
    <path d="M0 -20 L4 -4 20 0 4 4 0 20 -4 4 -20 0 -4 -4 Z" fill="#c9c1ff"/>
  </g>
</svg>
