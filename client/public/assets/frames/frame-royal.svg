      <rect x="-6" y="2" width="12" height="4" rx="2"/>
      <path d="M-4 8 L4 8 2 16 -2 16 Z"/>
    </g>
    <g transform="translate(460 52) scale(-.9 .9)">
      <path d="M0 -20 C6 -12 8 -6 6 0 L-6 0 C-8 -6 -6 -12 0 -20 Z"/>
      <path d="M-12 2 Q-16 -6 -10 -8 Q-6 -2 -6 2 Z"/>
      <path d="M12 2 Q16 -6 10 -8 Q6 -2 6 2 Z"/>
      <rect x="-6" y="2" width="12" height="4" rx="2"/>
      <path d="M-4 8 L4 8 2 16 -2 16 Z"/>
    </g>
    <g transform="translate(52 716) scale(.9 -.9)">
      <path d="M0 -20 C6 -12 8 -6 6 0 L-6 0 C-8 -6 -6 -12 0 -20 Z"/>
      <path d="M-12 2 Q-16 -6 -10 -8 Q-6 -2 -6 2 Z"/>
      <path d="M12 2 Q16 -6 10 -8 Q6 -2 6 2 Z"/>
      <rect x="-6" y="2" width="12" height="4" rx="2"/>
      <path d="M-4 8 L4 8 2 16 -2 16 Z"/>
    </g>
    <g transform="translate(460 716) scale(-.9 -.9)">
      <path d="M0 -20 C6 -12 8 -6 6 0 L-6 0 C-8 -6 -6 -12 0 -20 Z"/>
      <path d="M-12 2 Q-16 -6 -10 -8 Q-6 -2 -6 2 Z"/>
      <path d="M12 2 Q16 -6 10 -8 Q6 -2 6 2 Z"/>
      <rect x="-6" y="2" width="12" height="4" rx="2"/>
      <path d="M-4 8 L4 8 2 16 -2 16 Z"/>
    </g>
  </g>
  <!-- تاج صغير فوق -->
  <g transform="translate(256 50)" filter="url(#royalGlow)">
    <path d="M-30 10 L-22 -8 -10 4 0 -12 10 4 22 -8 30 10 Z" fill="url(#violet)" stroke="url(#royalGold)" stroke-width="2.5"/>
