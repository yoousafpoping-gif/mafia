<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="royalGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b08a2e"/>
      <stop offset=".5" stop-color="#f4d97b"/>
      <stop offset="1" stop-color="#8a6d1f"/>
    </linearGradient>
    <filter id="royalGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- الإطار الملكي: بنفسج ملكي وزنابق وذهب -->
  <rect x="14" y="14" width="484" height="740" rx="56" fill="none" stroke="url(#violet)" stroke-width="34" filter="url(#royalGlow)"/>
  <rect x="44" y="44" width="424" height="680" rx="34" fill="none" stroke="url(#royalGold)" stroke-width="4"/>
  <!-- زنبقة (فليور-دي-ليس) في الزوايا -->
