<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <linearGradient id="em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae7a"/>
      <stop offset=".5" stop-color="#0d7a4e"/>
      <stop offset="1" stop-color="#07492f"/>
    </linearGradient>
    <linearGradient id="emGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b08a2e"/>
      <stop offset=".5" stop-color="#f4d97b"/>
      <stop offset="1" stop-color="#b08a2e"/>
    </linearGradient>
    <filter id="emGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- إطار الزمرد: مخمل زمردي بخط ذهبي وأوراق غار في الزوايا -->
  <rect x="14" y="14" width="484" height="740" rx="56" fill="none" stroke="url(#em)" stroke-width="34"/>
  <rect x="44" y="44" width="424" height="680" rx="34" fill="none" stroke="url(#emGold)" stroke-width="4" filter="url(#emGlow)"/>
  <!-- أوراق غار في الزوايا الأربع -->
  <g fill="url(#emGold)" opacity=".95">
    <g transform="translate(48 48)">
      <path d="M0 0 Q14 -4 26 2 Q14 8 0 4 Z"/>
      <path d="M0 0 Q-4 14 2 26 Q8 14 4 0 Z"/>
      <circle r="4"/>
    </g>
    <g transform="translate(464 48) scale(-1 1)">
      <path d="M0 0 Q14 -4 26 2 Q14 8 0 4 Z"/>
      <path d="M0 0 Q-4 14 2 26 Q8 14 4 0 Z"/>
      <circle r="4"/>
    </g>
    <g transform="translate(48 720) scale(1 -1)">
      <path d="M0 0 Q14 -4 26 2 Q14 8 0 4 Z"/>
      <path d="M0 0 Q-4 14 2 26 Q8 14 4 0 Z"/>
      <circle r="4"/>
    </g>
    <g transform="translate(464 720) scale(-1 -1)">
      <path d="M0 0 Q14 -4 26 2 Q14 8 0 4 Z"/>
      <path d="M0 0 Q-4 14 2 26 Q8 14 4 0 Z"/>
      <circle r="4"/>
    </g>
  </g>
  <!-- جوهرة زمرد فوق في النص -->
  <g transform="translate(256 46)" filter="url(#emGlow)">
    <path d="M-14 0 L0 -14 14 0 0 14 Z" fill="#37d68f" stroke="#0a5c3b" stroke-width="2"/>
    <path d="M-14 0 L0 -14 0 14 Z" fill="#6ef0b6" opacity=".7"/>
  </g>
  <path d="M256 722 l12 8 -12 8 -12 -8 z" fill="url(#emGold)"/>
</svg>
